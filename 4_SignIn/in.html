<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styling.css">
    <script src="script.js"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <title>LOGIN</title>

  </head>
  <body>
    <div class="container">
      <div class="back-img">
        <img src="wave-haikei.svg" alt="" />
      </div>
      <p><b>Sign Up</b></p>
      <div class="login-form">
        <form>
          <div class="user-name">
            <i class="fa-solid fa-user"></i>
            <input type="text" placeholder=" Username" id="Username" required />
            <br />
          </div>
          <br />
          <div class="email">
            <i class="fa-solid fa-envelope"></i>
            <input
              type="email"
              placeholder="Email"
              id="Email"
              minlength="6"
              maxlength="25"
              required
            />
            <br />
          </div>
          <br />
          <div class="password">
            <i class="fa-solid fa-lock"></i>
            <input
              type="password"
              placeholder="Password"
              id="password"
              name="pass"
              minlength="8"
              maxlength="16"
              required
            />
          </div>
          <div class="custom-select" style="width:200px;">
            <select class="select-selected" required>
              <option value="">Choose Your Department</option>
              <option value="Computer Science and Engineering">Computer Science and Engineering</option>
              <option value="Electronics and Communication Engineering">Electronics and Communication Engineering</option>
              <option value="Electrical and Electronics Engineering">Electrical and Electronics Engineering</option>
              <option value="Mechanical Engineering">Mechanical Engineering</option>
              <option value="Civil Engineering">Civil Engineering</option>
              <option value="Information Technology">Information Technology</option>
            </select>
          </div>
          <div class="gender">
            <label class="gender-select">Select the Gender&nbsp;::</label> 
            <input type="radio" name="gen" id="radio-1" required>
            <label for="">Male</label>
            <input type="radio" name="gen" id="radio-1" required>
            <label for="">Female</label>
          </div>
          <div class="text">
            <textarea name="" id="" cols="35" rows="3" placeholder="Type About Yourself Few Words" required></textarea>
          </div>
          <div class="foot">
            <input type="checkbox" name="" class="box" required>
            <label for="" class="foot-box"><a href="">I am hereby accept the terms and conditions</a></label>
          </div>
          <div class="btn">
            <button type="button" onclick="check()" id="btn-1">SIGN UP</button>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
