<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
                function start(){
                    var a=document.getElementById("a1").value;
                    var reg="/^[a-z]$/i";
                    if(a.match(reg))
                        alert("same ");
                    else
                    alert("different");
                }
    </script>
</head>
<body>
    <form>
        <input type="text" name="a" id="a1"> 
        <input type="submit" value="" onclick="start()">
    </form>
</body>
</html>
